<!doctype html>
<html lang="[[lang]]">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>[[title]]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
      var dark = matchMedia("(prefers-color-scheme: dark)").matches;
      mermaid.initialize({ startOnLoad: false, deterministicIds: true, theme: dark ? "dark" : "neutral" });
      mermaid.run().catch(function () {});
    </script>
    <style>
      /* Same look as the review-page skill: one reading column, green = accent, yellow = look here */
      :root {
        --bg: #f6f7f5;
        --surface: #ffffff;
        --fg: #18211e;
        --muted: #5b6662;
        --accent: #1f6f63;
        --line: #d9dedb;
        --q-bg: #fcebb6;
        --q-fg: #3d2a00;
        --q-line: #c9922a;
        --add-bg: #e3f4e8;
        --add-sig: #1d7a3a;
        --del-bg: #fbe5e3;
        --del-sig: #b3261e;
        --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121816;
          --surface: #1a2220;
          --fg: #e6ece9;
          --muted: #9aa7a2;
          --accent: #6cc2b3;
          --line: #2c3633;
          --q-bg: #4a3a12;
          --q-fg: #fbe7b0;
          --add-bg: #173323;
          --add-sig: #6fd08f;
          --del-bg: #3d1d1b;
          --del-sig: #f2918a;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--body);
        font-size: 17px;
        line-height: 1.55;
        padding: 32px 16px 64px;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      h1,
      h2 {
        font-family: var(--display);
        text-wrap: balance;
        margin: 0;
        line-height: 1.15;
      }
      h1 {
        font-size: 2.2rem;
      }
      h2 {
        font-size: 1.5rem;
        color: var(--accent);
      }
      p {
        margin: 0;
        max-width: 72ch;
      }
      a {
        color: var(--accent);
      }
      a:focus-visible,
      button:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      header,
      section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      section {
        padding-top: 20px;
        border-top: 1px solid var(--line);
        scroll-margin-top: 72px;
      }
      .lead {
        color: var(--muted);
        font-size: 1.1rem;
      }
      .srcline,
      .note,
      .guide {
        color: var(--muted);
        font-size: 0.95rem;
      }
      blockquote {
        margin: 0;
        padding: 12px 16px;
        border-left: 4px solid var(--accent);
        background: var(--surface);
        border-radius: 4px;
        max-width: 72ch;
      }
      nav ol {
        margin: 0;
        padding-left: 1.4em;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      ul.plain {
        margin: 0;
        padding-left: 1.2em;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 72ch;
      }
      .chip {
        display: inline-block;
        font-family: var(--body);
        font-weight: 600;
        font-size: 0.8rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: var(--q-bg);
        color: var(--q-fg);
        border: 1px solid var(--q-line);
        border-radius: 999px;
        padding: 1px 10px;
        vertical-align: middle;
        margin-left: 8px;
      }
      .chip.soft {
        background: var(--surface);
        color: var(--muted);
        border-color: var(--line);
      }
      .risk {
        background: var(--q-bg);
        color: var(--q-fg);
        border-left: 4px solid var(--q-line);
        padding: 10px 14px;
        border-radius: 4px;
      }
      /* Where a purpose comes from: plain fact (conversation, commit, plan) or a guess (inferred, yellow) */
      .src {
        display: inline-block;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border: 1px solid var(--accent);
        color: var(--accent);
        border-radius: 4px;
        padding: 0 6px;
        margin-right: 6px;
        vertical-align: 0.1em;
      }
      .src-inferred {
        background: var(--q-bg);
        color: var(--q-fg);
        border-color: var(--q-line);
      }
      .plan,
      .see {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        max-width: none;
      }
      .see {
        border-left: 4px solid var(--accent);
      }
      .commits {
        font-size: 0.95rem;
        color: var(--muted);
      }
      .commits code {
        font-family: var(--mono);
        font-size: 0.85em;
      }
      .commits pre.msg {
        white-space: pre-wrap;
        font-family: var(--body);
        margin: 4px 0 0;
        padding: 6px 10px;
        border-left: 3px solid var(--line);
      }
      .links ul {
        margin-top: 4px;
      }
      .diagram {
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .diagram pre.mermaid {
        margin: 0;
        background: transparent;
        text-align: center;
      }
      /* Sticky bar: title on the left, view switch and fold-all on the right */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        margin: -32px -16px 24px;
        padding: 10px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
      }
      .bar-title {
        flex: 1;
        min-width: 0;
        font-family: var(--display);
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--fg);
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Group jump: where you are, a menu of every section, previous and next */
      .jump {
        position: relative;
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        flex: 0 1 380px;
      }
      .jump .cur {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
      }
      .jump .step {
        flex: none;
        padding: 3px 8px;
      }
      .jump .menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        width: min(420px, calc(100vw - 32px));
        max-height: 70vh;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        padding: 8px;
      }
      .jump .menu ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .jump .menu button {
        all: unset;
        box-sizing: border-box;
        display: flex;
        gap: 8px;
        align-items: center;
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--fg);
      }
      .jump .menu button:hover,
      .jump .menu button:focus-visible {
        background: var(--bg);
      }
      .jump .menu button[aria-current="true"] {
        font-weight: 600;
        color: var(--accent);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .jump .menu .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: transparent;
      }
      .jump .menu .flag .dot {
        background: var(--q-line);
      }
      .jump .menu .note {
        margin-top: 6px;
        padding: 6px 8px 0;
        border-top: 1px solid var(--line);
        font-size: 0.85rem;
      }
      .bar-tools,
      .view {
        display: flex;
        gap: 8px;
        align-items: center;
        flex: none;
      }
      .view button:first-child {
        border-radius: 6px 0 0 6px;
      }
      .view button:last-child {
        border-radius: 0 6px 6px 0;
        margin-left: -9px;
      }
      #top {
        scroll-margin-top: 72px;
      }
      /* A group folds to its heading; the caret shows its state */
      details.gbox > summary {
        list-style: none;
        cursor: pointer;
      }
      details.gbox > summary::-webkit-details-marker {
        display: none;
      }
      details.gbox > summary h2::after {
        content: "\25B8";
        display: inline-block;
        margin-left: 0.4em;
        font-size: 0.75em;
        color: var(--muted);
        transition: transform 0.15s;
      }
      details.gbox[open] > summary h2::after {
        transform: rotate(90deg);
      }
      /* Flex children may shrink below their content, so wide code scrolls inside its box, not the page */
      main > *,
      section > *,
      .gbody > *,
      details.gbox,
      details.codebox {
        min-width: 0;
      }
      .gbody {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 12px;
      }
      button {
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--accent);
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      button[aria-pressed="true"],
      button.primary {
        background: var(--accent);
        color: var(--bg);
      }
      details.codebox > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 8px;
      }
      .hunk {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .hunk-head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem;
      }
      .hunk-head .path {
        font-family: var(--mono);
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }
      .hunk-head .meta {
        color: var(--muted);
      }
      .hunk-head .tools {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .hunk > .note {
        padding: 8px 10px;
      }
      .ctx-line {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--muted);
        padding: 4px 10px;
        border-bottom: 1px solid var(--line);
      }
      .code {
        overflow-x: auto;
      }
      .code table {
        border-collapse: collapse;
        width: 100%;
        font-family: var(--mono);
        font-size: 0.82rem;
        line-height: 1.45;
      }
      .code td.n {
        width: 1%;
        min-width: 3.2em;
        text-align: right;
        padding: 0 8px;
        color: var(--muted);
        user-select: none;
        vertical-align: top;
      }
      .code td.c {
        white-space: pre;
        padding: 0 10px 0 0;
      }
      .code .sig {
        display: inline-block;
        width: 1.4em;
        text-align: center;
        user-select: none;
      }
      .code td.add {
        background: var(--add-bg);
      }
      .code td.add .sig {
        color: var(--add-sig);
      }
      .code td.del {
        background: var(--del-bg);
      }
      .code td.del .sig {
        color: var(--del-sig);
      }
      .code td.empty {
        background: var(--bg);
      }
      /* Two equal halves; long lines wrap inside their half */
      .code table.split {
        table-layout: fixed;
      }
      .code table.split td.n {
        width: 3.4em;
      }
      .code table.split td.c {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .code table.split {
        display: none;
      }
      body.split .code table.split {
        display: table;
      }
      body.split .code table.uni:not(:only-child) {
        display: none;
      }
      /* A phone always gets one column */
      @media (max-width: 760px) {
        body.split .code table.split {
          display: none;
        }
        body.split .code table.uni {
          display: table !important;
        }
        .view,
        .bar-title {
          display: none;
        }
        .jump {
          flex: 1;
        }
      }
      .group-tools {
        display: flex;
        gap: 8px;
      }
      /* Explain panel: optional question, the prompt, a copy button */
      .ask {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--surface);
        border: 2px solid var(--accent);
        border-radius: 10px;
        padding: 12px;
        margin: 6px 0 12px;
      }
      .ask textarea {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        min-height: 2.6em;
        resize: vertical;
      }
      .ask textarea[readonly] {
        font-family: var(--mono);
        font-size: 0.8rem;
        background: transparent;
        border-style: dashed;
      }
      .ask .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .totop {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: var(--bg);
        text-decoration: none;
        font-size: 1.3rem;
      }
    </style>
  </head>
  <body>
    [[bar]] [[main]]
    <a class="totop" href="#top" aria-label="top">↑</a>
    <script>
      (function () {
        var D = [[data]];
        var T = [[js_strings]];

        function copy(text, done) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
              function () {
                done(T.copied);
              },
              function () {
                done(T.copy_failed);
              },
            );
          } else {
            done(T.copy_failed);
          }
        }
        function flash(btn, text) {
          var old = btn.textContent;
          btn.textContent = text;
          setTimeout(function () {
            btn.textContent = old;
          }, 1400);
        }

        // Fold or open every group; the button names what it will do next.
        var groups = Array.prototype.slice.call(document.querySelectorAll("details.gbox"));
        var foldAll = document.getElementById("fold-all");
        function syncFold() {
          var anyOpen = groups.some(function (d) {
            return d.open;
          });
          foldAll.textContent = anyOpen ? T.collapse_all : T.expand_all;
        }
        foldAll.addEventListener("click", function () {
          var open = !groups.some(function (d) {
            return d.open;
          });
          groups.forEach(function (d) {
            d.open = open;
          });
          syncFold();
        });
        groups.forEach(function (d) {
          d.addEventListener("toggle", syncFold);
        });
        // A link to a folded group opens it first.
        function openTarget() {
          var t = location.hash && document.getElementById(location.hash.slice(1));
          var d = t && t.querySelector("details.gbox");
          if (d) d.open = true;
        }
        window.addEventListener("hashchange", openTarget);
        document.querySelectorAll('a[href^="#"]').forEach(function (a) {
          a.addEventListener("click", function () {
            setTimeout(openTarget, 0);
          });
        });

        // Jump between sections from the bar: where you are, a menu, previous/next, and keys.
        var bar = document.querySelector(".topbar");
        var jump = bar.querySelector(".jump");
        var curBtn = jump.querySelector(".cur"),
          curText = jump.querySelector(".cur-text");
        var menu = jump.querySelector(".menu"),
          list = menu.querySelector("ol");
        var secs = Array.prototype.slice.call(document.querySelectorAll("main > section[id]"));
        var items = secs.map(function (sec) {
          var h = sec.querySelector("h2");
          var chip = h.querySelector(".chip");
          var label = h.cloneNode(true);
          label.querySelectorAll(".chip").forEach(function (c) {
            c.remove();
          });
          var li = document.createElement("li");
          var b = document.createElement("button");
          b.type = "button";
          var flagged = sec.id === "no-code" || (chip && !chip.classList.contains("soft"));
          if (flagged) b.classList.add("flag");
          b.innerHTML = '<span class="dot"></span><span></span>';
          b.lastChild.textContent = label.textContent.trim() + (chip ? " · " + chip.textContent.trim() : "");
          b.addEventListener("click", function () {
            closeMenu();
            go(secs.indexOf(sec));
          });
          li.appendChild(b);
          list.appendChild(li);
          return { sec: sec, btn: b, label: label.textContent.trim() };
        });
        var cur = -1;
        function current() {
          // A jump parks a section at its scroll margin, below the bar: count it as reached there.
          var margin = parseFloat(getComputedStyle(secs[0] || document.body).scrollMarginTop) || 0;
          var line = Math.max(bar.offsetHeight, margin) + 12,
            idx = -1;
          secs.forEach(function (sec, i) {
            if (sec.getBoundingClientRect().top <= line) idx = i;
          });
          return idx;
        }
        function paint(at) {
          cur = typeof at === "number" ? at : current();
          curText.textContent = cur < 0 ? T.nav_menu + " (" + secs.length + ")" : cur + 1 + "/" + secs.length + " · " + items[cur].label;
          items.forEach(function (it, i) {
            it.btn.setAttribute("aria-current", String(i === cur));
          });
        }
        function go(i) {
          if (i < 0 || i >= secs.length) return;
          var d = secs[i].querySelector("details.gbox");
          if (d) d.open = true;
          secs[i].scrollIntoView({ block: "start" });
          history.replaceState(null, "", "#" + secs[i].id);
          paint(i);
        }
        function step(n) {
          go(cur < 0 ? (n > 0 ? 0 : -1) : cur + n);
        }
        function closeMenu() {
          menu.hidden = true;
          curBtn.setAttribute("aria-expanded", "false");
        }
        curBtn.addEventListener("click", function () {
          menu.hidden = !menu.hidden;
          curBtn.setAttribute("aria-expanded", String(!menu.hidden));
          if (!menu.hidden) (items[cur] || items[0]).btn.focus();
        });
        jump.querySelectorAll(".step").forEach(function (b) {
          b.addEventListener("click", function () {
            step(Number(b.dataset.step));
          });
        });
        document.addEventListener("click", function (e) {
          if (!jump.contains(e.target)) closeMenu();
        });
        var ticking = false;
        window.addEventListener(
          "scroll",
          function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {
              ticking = false;
              paint();
            });
          },
          { passive: true },
        );
        document.addEventListener(
          "toggle",
          function () {
            paint();
          },
          true,
        );
        paint();
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeMenu();
            return;
          }
          var t = e.target;
          if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable) return;
          if (e.key === "j") {
            e.preventDefault();
            step(1);
          } else if (e.key === "k") {
            e.preventDefault();
            step(-1);
          } else if (e.key === "o" && cur >= 0) {
            var d = secs[cur].querySelector("details.gbox");
            if (d) {
              d.open = !d.open;
              if (!d.open) secs[cur].scrollIntoView({ block: "start" });
            }
          }
        });

        // One or two columns; the choice is remembered per browser when storage works.
        function setView(v) {
          document.body.classList.toggle("split", v === "split");
          document.querySelectorAll("[data-view]").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.view === v));
          });
          try {
            localStorage.setItem("wyd-view", v);
          } catch (e) {}
        }
        document.querySelectorAll("[data-view]").forEach(function (b) {
          b.addEventListener("click", function () {
            setView(b.dataset.view);
          });
        });
        try {
          if (localStorage.getItem("wyd-view") === "split") setView("split");
        } catch (e) {}

        document.querySelectorAll(".copy-path").forEach(function (b) {
          b.addEventListener("click", function () {
            copy(b.dataset.copy, function (msg) {
              flash(b, msg);
            });
          });
        });

        function prompt(btn, question) {
          var lines = ["/what-you-did focus " + D.snapshot];
          lines.push("Source: " + (D.range ? "commits " + D.range : "uncommitted changes on " + D.base));
          if (D.workspace) lines.push("Workspace: " + D.workspace);
          lines.push("Page: " + D.page);
          if (btn.dataset.part) lines.push("Part: " + btn.dataset.part);
          if (btn.dataset.hunks) lines.push("Hunks: " + btn.dataset.hunks);
          lines.push("Where: " + btn.dataset.where);
          lines.push("Question: " + (question.trim() || T.default_question));
          return lines.join("\n");
        }

        document.querySelectorAll(".explain").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var host = btn.closest(".hunk-head") || btn.parentNode;
            var next = host.nextElementSibling;
            if (next && next.classList.contains("ask")) {
              next.remove();
              return;
            }
            var box = document.createElement("div");
            box.className = "ask";
            box.innerHTML =
              '<label class="note">' +
              T.question_label +
              '<textarea class="q" placeholder="' +
              T.question_placeholder +
              '"></textarea></label>' +
              '<textarea class="p" readonly aria-label="prompt"></textarea>' +
              '<div class="row"><button type="button" class="primary">' +
              T.copy_prompt +
              '</button><span class="note">' +
              T.paste_hint +
              "</span></div>";
            host.parentNode.insertBefore(box, host.nextSibling);
            var q = box.querySelector(".q"),
              p = box.querySelector(".p"),
              c = box.querySelector("button");
            function upd() {
              p.value = prompt(btn, q.value);
              p.rows = p.value.split("\n").length + 1;
            }
            q.addEventListener("input", upd);
            upd();
            c.addEventListener("click", function () {
              copy(p.value, function (msg) {
                flash(c, msg);
              });
            });
            q.focus();
          });
        });
      })();
    </script>
  </body>
</html>
