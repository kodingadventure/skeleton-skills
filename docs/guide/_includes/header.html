<header class="site-header" role="banner">
  <div class="wrapper header-bar">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      <img class="site-logo" src="{{ "/assets/ka-logo.png" | relative_url }}" alt="" width="32" height="32">
      <span>skeleton-skills <em>guide</em></span>
    </a>

    <nav class="site-nav" aria-label="Guide pages">
      {%- for path in site.header_pages -%}
        {%- assign my_page = site.pages | where: "path", path | first -%}
        {%- if my_page.title -%}
        <a class="page-link{% if page.url == my_page.url %} is-current{% endif %}" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>

    <div class="site-search" role="search">
      <input id="search-input" type="search" placeholder="Search the guide" aria-label="Search the guide" autocomplete="off" data-index="{{ "/assets/search.json" | relative_url }}">
      <kbd class="search-hint" aria-hidden="true">/</kbd>
      <div id="search-results" class="search-results" hidden></div>
    </div>
  </div>
</header>
